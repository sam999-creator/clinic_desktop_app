name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [ main ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: [3.12]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
      - name: Restore wheel cache
        uses: actions/cache@v4
        with:
          path: .wheels
          key: ${{ runner.os }}-wheels-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-wheels-
      - name: Install system dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          # Try multiple common package names; don't fail the job if one of them is unavailable.
          sudo apt-get install -y libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri libx11-6 libxkbcommon0 libxcb-xinerama0 || true
      - name: Prepare wheelhouse (.wheels)
        run: python scripts/prepare_wheels.py
      - name: Show wheel count
        run: python -c "import os; print('Wheels count:', len(os.listdir('.wheels')) if os.path.exists('.wheels') else 'no .wheels dir')"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # prefer installing from local wheel cache if present, otherwise fall back to PyPI
          pip install --no-index --find-links .wheels -r requirements.txt || pip install -r requirements.txt || pip install -r requirements.txt
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q -W default
