name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [ main ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: [3.12]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
      - name: Install system dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1-mesa-glx libxkbcommon0 libxcb-xinerama0
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # retry pip install up to 3 times to handle transient network issues / large wheel downloads
          for i in 1 2 3; do pip install -r requirements.txt && break || sleep 10; done
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q -W default
