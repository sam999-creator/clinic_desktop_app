name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [ main ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: [3.12]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
      - name: Install system dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          # Try multiple common package names; don't fail the job if one of them is unavailable.
          sudo apt-get install -y libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri libx11-6 libxkbcommon0 libxcb-xinerama0 || true
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # retry pip install up to 3 times to handle transient network issues / large wheel downloads (cross-platform)
          python -c "import sys; exec('''import subprocess,sys,time
for i in range(3):
    r=subprocess.run([sys.executable,'-m','pip','install','-r','requirements.txt'])
    if r.returncode==0:
        break
    if i==2:
        sys.exit(r.returncode)
    time.sleep(10)
''')"
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q -W default
